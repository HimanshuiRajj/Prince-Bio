<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince Bio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Comfortaa">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Embed Do DC -->
    <meta content="Prince Bio" property="og:title" />
    <meta content="Bio Site Of Prince" property="og:description" />
    <meta content="localhost" property="og:url" />
    <meta content="https://i.postimg.cc/9F2p0Csn/8b93d1aead472b2dc5ae37c5b496e296.jpg" property="og:image" />
    <meta content="#000000" data-react-helmet="true" name="theme-color" />

    <style>
        /* Example styling for icon hover */
        .icon-links a {
            color: white;
            font-size: 1.8em;
            margin: 0 10px;
            transition: color 0.3s ease;
        }
        .icon-links a:hover {
            color: red;
        }
    </style>
</head>
<body>
    <!-- Background Video -->
    <div class="video-container">
        <video autoplay muted loop>
            <source src="P13.mp4" type="video/mp4" />
        </video>
        <!-- Background Music -->
        <audio id="bgMusic" loop>
            <source src="P13.mp4" type="audio/mpeg" />
        </audio>
    </div>

    <!-- Content Section -->
    <div class="caption">
        <div class="card-container">
            <div class="card">
                <!-- Logo -->
                <div class="logo">
                    <img src="https://i.postimg.cc/9F2p0Csn/8b93d1aead472b2dc5ae37c5b496e296.jpg" alt="Logo">
                </div>
                <!-- Name -->
                <div class="nick">𝐏𝐑𝐈𝐍𝐂𝐄♡࿐</div>
                <!-- Links -->
                <div class="icon-links">
                    <a href="https://t.me/Tubelight_lofi" target="_blank"><i class="fab fa-telegram"></i></a>
                    <a href="https://youtube.com/@crazy-jy-o9o?si=CpRUuO0VCBoPMSIa" target="_blank"><i class="fab fa-youtube"></i></a>
                    <a href="https://www.instagram.com/rocky_maurya_ji?igsh=MWtsZTZpbHQ0aDR3ZA==" target="_blank"><i class="fab fa-instagram"></i></a>
                </div>
                <!-- Song Card -->
                <div class="song-card">
                    <div class="song-cover">
                        <img src="https://i.postimg.cc/vm2Y03RP/da8c498e73af2117fefdb65a59701a0f.jpg" alt="Okładka">
                    </div>
                    <div class="song-info">
                        <div class="song-title">𝐏𝐑𝐈𝐍𝐂𝐄</div>
                        <div class="song-author">sᴛᴜᴅᴇɴᴛ & ᴄʀᴇᴀᴛᴏʀ</div>
                    </div>
                    <div class="card-glow"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Control Button -->
    <div class="audio-control" id="audioControl">
        <div class="audio-icon" id="audioIcon"><i class="fas fa-volume-Play"></i></div>
        <div class="audio-text" id="audioText">Tap To Play Music</div>
    </div>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const audioControl = document.getElementById('audioControl');
        const audioIcon = document.getElementById('audioIcon');
        const audioText = document.getElementById('audioText');

        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                bgMusic.pause();
                audioIcon.innerHTML = '<i class="fas fa-volume-mute"></i>';
            } else {
                bgMusic.play();
                audioIcon.innerHTML = '<i class="fas fa-volume-up"></i>';
            }
            isPlaying = !isPlaying;
        }

        function animateText() {
            audioText.classList.add('active');
            setTimeout(() => {
                audioText.classList.remove('active');
            }, 1000);
            setTimeout(animateText, 5000);
        }

        animateText();
        audioControl.addEventListener('click', toggleAudio);
    </script>
</body>

</html>
